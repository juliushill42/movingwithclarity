version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clarity
      POSTGRES_PASSWORD: clarity
      POSTGRES_DB: clarity
    ports:
      - "5432:5432"
    volumes:
      - clarity_pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      DATABASE_URL: postgres://clarity:clarity@postgres:5432/clarity
      PORT: 4001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4001:4001"

  ops-service:
    build:
      context: .
      dockerfile: ops-service/Dockerfile
    environment:
      BOOKING_SERVICE_URL: http://booking-service:4001
      PORT: 4002
    depends_on:
      - booking-service
    ports:
      - "4002:4002"

  ledger-service:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    environment:
      DATABASE_URL: postgres://clarity:clarity@postgres:5432/clarity
      PORT: 4003
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4003:4003"

  ai-bridge:
    build:
      context: ai-bridge
      dockerfile: Dockerfile
    environment:
      MODEL_PATH: /app/models/model.gguf
      N_CTX: 4096
    volumes:
      - ./ai-bridge/models:/app/models
      - ./ai-bridge/data:/app/data
    ports:
      - "8000:8000"

  chat-service:
    build:
      context: chat-service
      dockerfile: Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      AI_BRIDGE_URL: http://ai-bridge:8000
      PORT: 4004
    depends_on:
      - ai-bridge
    ports:
      - "4004:4004"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      BOOKING_SERVICE_URL: http://booking-service:4001
      OPS_SERVICE_URL: http://ops-service:4002
      LEDGER_SERVICE_URL: http://ledger-service:4003
      CHAT_SERVICE_URL: http://chat-service:4004
      CLARITY_API_KEYS: ${CLARITY_API_KEYS:-dev-key-change-me:00000000-0000-0000-0000-000000000001}
      PORT: 4000
    depends_on:
      - booking-service
      - ops-service
      - ledger-service
      - chat-service
    ports:
      - "4000:4000"

volumes:
  clarity_pg_data:
